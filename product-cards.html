<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Cards</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #f8f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.75rem;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e8e5e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease;
    }

    .product-card:hover {
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.09);
    }

    /* ── Image ── */
    .card-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #ddd8d0; /* placeholder color shown before image loads */
      overflow: hidden;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Badge ── */
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #3b3530;
      color: #f8f7f5;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
      z-index: 1;
    }

    /* ── Card body ── */
    .card-body {
      padding: 1.25rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1614;
      line-height: 1.3;
    }

    .card-price {
      font-size: 0.95rem;
      color: #6b6460;
      font-weight: 400;
    }

    .btn-cart {
      margin-top: auto;
      padding-top: 1rem;
      width: 100%;
      background: #3b3530;
      color: #f8f7f5;
      border: none;
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-cart:hover {
      background: #5c4f48;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .product-grid {
        grid-template-columns: 1fr;
        padding: 1.25rem;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <section class="product-grid">

    <!-- Card 1 -->
    <div class="product-card">
      <div class="card-image-wrapper">
        <span class="badge">Best Seller</span>
        <!--
          Replace YOUR_WIX_IMAGE_URL_1 with the URL from your Wix Media Manager.
          To get the URL: Wix Editor → Add → Image → My Uploads → right-click image → Copy URL
        -->
        <img src="YOUR_WIX_IMAGE_URL_1" alt="Product 1" />
      </div>
      <div class="card-body">
        <h3 class="card-title">Product Name One</h3>
        <p class="card-price">$24.00</p>
        <button class="btn-cart">Add to Cart</button>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="product-card">
      <div class="card-image-wrapper">
        <!-- Replace YOUR_WIX_IMAGE_URL_2 with your Wix Media Manager URL -->
        <img src="YOUR_WIX_IMAGE_URL_2" alt="Product 2" />
      </div>
      <div class="card-body">
        <h3 class="card-title">Product Name Two</h3>
        <p class="card-price">$32.00</p>
        <button class="btn-cart">Add to Cart</button>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="product-card">
      <div class="card-image-wrapper">
        <span class="badge">New</span>
        <!-- Replace YOUR_WIX_IMAGE_URL_3 with your Wix Media Manager URL -->
        <img src="YOUR_WIX_IMAGE_URL_3" alt="Product 3" />
      </div>
      <div class="card-body">
        <h3 class="card-title">Product Name Three</h3>
        <p class="card-price">$28.00</p>
        <button class="btn-cart">Add to Cart</button>
      </div>
    </div>

  </section>

</body>
</html>
